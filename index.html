<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
    <script>
      // Initialize dark mode before React renders to prevent flash
      const themeMode = localStorage.getItem('theme-mode');
      const isDark = themeMode ? themeMode === 'dark' : true;
      if (isDark) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
      
      // Fix for "Cannot set property fetch of #<Window> which has only a getter"
      // This error occurs when a library tries to overwrite window.fetch
      try {
        if (window.fetch) {
          const originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            value: originalFetch,
            writable: true,
            configurable: true
          });
        }
      } catch (e) {
        console.warn('Could not patch window.fetch:', e);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
